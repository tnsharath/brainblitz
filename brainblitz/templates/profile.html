{% extends "base.html" %}

{% block title %}Profile · BrainBlitz{% endblock %}

{% block content %}
  <div class="card narrow narrow--profile">
    <h1>Your profile</h1>
    <p>Signed in as <code>{{ request.user.username }}</code></p>

    <form method="post" class="stack stack--md">
      {% csrf_token %}
      <div>
        <div class="field-label">Bio</div>
        <textarea name="bio" rows="5">{{ profile.bio|default:"" }}</textarea>
      </div>
      <div class="row-actions">
        <button class="btn" type="submit">Save</button>
        <a class="btn secondary" href="{% url 'quiz:submit_question' %}">Submit a question</a>
      </div>
    </form>
  </div>
{% endblock %}
