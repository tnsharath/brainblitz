{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="{% static 'brainblitz/logo.svg' %}" type="image/svg+xml" />
    <title>{% block title %}BrainBlitz{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #0a0e14;
        --surface: rgba(26, 31, 43, 0.45);
        --card: rgba(255, 255, 255, 0.055);
        --card-inner: rgba(255, 255, 255, 0.04);
        --text: #f4f7ff;
        --muted: #8a94a6;
        --border: rgba(255, 255, 255, 0.1);
        --border-strong: rgba(255, 255, 255, 0.14);
        --accent-yellow: #ffcc66;
        --accent-blue: #4a90e2;
        --accent-green: #50e3c2;
        --accent-orange: #f5a623;
        --accent-purple: #a78bfa;
        --accent-pink: #ff5a8f;
        --accent-teal: #23c3ff;
        --brand: #6366f1;
        --brand2: #22d3ee;
        --glow-purple: rgba(99, 102, 241, 0.35);
        --glow-teal: rgba(34, 211, 238, 0.22);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI,
          Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        font-size: 15px;
        line-height: 1.55;
        background: radial-gradient(
            1200px 900px at 12% 100%,
            rgba(74, 144, 226, 0.16),
            transparent 55%
          ),
          radial-gradient(
            1000px 700px at 88% 5%,
            rgba(80, 227, 194, 0.12),
            transparent 50%
          ),
          radial-gradient(
            900px 700px at 50% 40%,
            rgba(99, 102, 241, 0.08),
            transparent 55%
          ),
          var(--bg-deep);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a.text-link {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      a.text-link:hover {
        color: var(--accent-teal);
      }
      .container {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        background: rgba(10, 14, 20, 0.72);
        border-bottom: 1px solid var(--border);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0;
        gap: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: 1.05rem;
      }
      .logo {
        display: inline-flex;
        line-height: 0;
        flex-shrink: 0;
        border-radius: 12px;
        box-shadow: 0 12px 36px var(--glow-purple);
      }
      .logo img {
        display: block;
        width: 38px;
        height: 38px;
        border-radius: 12px;
      }
      .brand-text .brand-accent {
        color: var(--accent-yellow);
        font-weight: 800;
      }
      .links {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease,
          transform 0.18s ease;
      }
      .pill:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--border-strong);
        color: var(--text);
      }
      main {
        padding: 28px 0 56px;
      }
      .card {
        border: 1px solid var(--border);
        background: var(--card);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 20px;
        padding: 22px 24px;
        box-shadow: 0 24px 72px rgba(0, 0, 0, 0.45);
      }
      .card--tight {
        padding: 16px 18px;
      }
      .card--nested {
        background: var(--card-inner);
        border-radius: 16px;
        box-shadow: none;
      }
      .card--error {
        border-color: rgba(255, 120, 120, 0.45);
        background: rgba(255, 60, 60, 0.06);
      }
      h1,
      h2,
      h3 {
        margin: 0 0 12px 0;
        letter-spacing: -0.03em;
        line-height: 1.2;
        font-weight: 800;
      }
      h1 {
        font-size: clamp(1.65rem, 2.5vw, 2rem);
      }
      h2 {
        font-size: 1.25rem;
        font-weight: 700;
      }
      h3 {
        font-size: 1.05rem;
        font-weight: 700;
      }
      p {
        margin: 0 0 14px 0;
        color: var(--muted);
        line-height: 1.6;
      }
      p:last-child {
        margin-bottom: 0;
      }
      .lede {
        font-size: 1.02rem;
        color: rgba(244, 247, 255, 0.88);
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .page-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--accent-teal);
      }
      .badge--outline-blue {
        color: var(--accent-blue);
        border-color: rgba(74, 144, 226, 0.45);
        background: rgba(74, 144, 226, 0.08);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 16px;
      }
      .col-12 {
        grid-column: span 12;
      }
      .col-8 {
        grid-column: span 8;
      }
      .col-4 {
        grid-column: span 4;
      }
      @media (max-width: 900px) {
        .col-8,
        .col-4 {
          grid-column: span 12;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 18px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: linear-gradient(135deg, var(--brand), #8b5cf6 50%, #0891b2);
        color: white;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 8px 28px rgba(99, 102, 241, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
        filter: brightness(1.06);
        box-shadow: 0 12px 32px rgba(99, 102, 241, 0.42);
      }
      .btn.secondary {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--border-strong);
        color: var(--text);
        box-shadow: none;
      }
      .btn.secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
      .stack {
        display: grid;
        gap: 12px;
      }
      .stack--md {
        gap: 14px;
      }
      .stack--lg {
        gap: 18px;
      }
      .row-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 4px;
      }
      .row-actions--top {
        margin-top: 16px;
      }
      .narrow {
        max-width: 560px;
        margin-left: auto;
        margin-right: auto;
      }
      .narrow--md {
        max-width: 640px;
      }
      .narrow--profile {
        max-width: 760px;
      }
      .hero-strip {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 22px;
        border-radius: 18px;
        border: 1px solid rgba(74, 144, 226, 0.35);
        background: linear-gradient(
          135deg,
          rgba(74, 144, 226, 0.12),
          rgba(99, 102, 241, 0.08)
        );
        margin-bottom: 20px;
      }
      .hero-strip h1 {
        margin-bottom: 8px;
      }
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
        margin-top: 8px;
      }
      .feature-tile {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: start;
        padding: 16px 16px 16px 18px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--card-inner);
        overflow: hidden;
      }
      .feature-tile::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--tile-accent, var(--accent-blue));
        border-radius: 16px 0 0 16px;
      }
      .feature-tile__icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 20px;
        background: color-mix(in srgb, var(--tile-accent, var(--accent-blue)) 22%, transparent);
      }
      .feature-tile h3 {
        margin-bottom: 6px;
        font-size: 0.95rem;
      }
      .feature-tile p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
      }
      .quiz-item {
        border-left: 4px solid var(--quiz-accent, var(--accent-blue));
      }
      .quiz-item h3 {
        margin-bottom: 8px;
      }
      .field-label {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .choice-label {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .choice-label:hover {
        border-color: var(--border-strong);
        background: rgba(255, 255, 255, 0.05);
      }
      .choice-label:has(input:checked) {
        border-color: rgba(99, 102, 241, 0.55);
        background: rgba(99, 102, 241, 0.12);
      }
      .lb-head {
        display: grid;
        grid-template-columns: 70px 1fr 120px 160px;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 12px;
        padding: 0 4px;
      }
      .lb-rows {
        display: grid;
        gap: 10px;
      }
      .lb-row {
        display: grid;
        grid-template-columns: 70px 1fr 120px 160px;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .lb-row--self {
        background: rgba(99, 102, 241, 0.14);
        border-color: rgba(99, 102, 241, 0.35);
      }
      .lb-rank {
        color: rgba(244, 247, 255, 0.85);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .lb-user {
        font-weight: 700;
      }
      .lb-date {
        color: var(--muted);
        font-size: 13px;
      }
      .score-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 3.5rem;
        padding: 6px 12px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        background: rgba(99, 102, 241, 0.2);
        border: 1px solid rgba(99, 102, 241, 0.35);
        color: var(--text);
      }
      .tag-ok {
        margin-left: 10px;
        color: rgba(150, 255, 190, 0.95);
        font-weight: 700;
      }
      .tag-bad {
        margin-left: 10px;
        color: rgba(255, 180, 180, 0.95);
        font-weight: 700;
      }
      .result-block {
        font-weight: 700;
        margin-bottom: 10px;
        line-height: 1.4;
      }
      .data-rows {
        display: grid;
        gap: 8px;
      }
      .data-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        font-size: 14px;
      }
      .data-row--header {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.04);
      }
      @media (max-width: 720px) {
        .lb-head,
        .lb-row {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .lb-head {
          display: none;
        }
        .lb-row .lb-date {
          font-size: 12px;
        }
      }
      input[type="text"],
      input[type="password"],
      input[type="email"],
      textarea,
      select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.22);
        color: var(--text);
        font: inherit;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: rgba(99, 102, 241, 0.55);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      }
      textarea {
        resize: vertical;
        min-height: 120px;
      }
      code {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--border);
        padding: 2px 8px;
        border-radius: 8px;
        font-size: 0.88em;
      }
      footer {
        padding: 20px 0 44px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 13px;
      }
      .footer-inner {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .footer-inner img {
        border-radius: 6px;
        opacity: 0.85;
      }
      ul.errorlist {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        color: rgba(255, 170, 170, 0.95);
        font-size: 14px;
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <header>
      <div class="container">
        <div class="nav">
          <a class="brand" href="{% url 'home' %}">
            <span class="logo" aria-hidden="true">
              <img
                src="{% static 'brainblitz/logo.svg' %}"
                width="38"
                height="38"
                alt=""
                decoding="async"
              />
            </span>
            <span class="brand-text"
              >Brain<span class="brand-accent">Blitz</span></span
            >
          </a>
          <nav class="links">
            <a class="pill" href="{% url 'home' %}">Home</a>
            <a class="pill" href="{% url 'quiz:list' %}">Quiz list</a>
            <a class="pill" href="{% url 'quiz:submit_question' %}">Submit question</a>
            {% if request.user.is_authenticated %}
              <a class="pill" href="{% url 'profile' %}">Profile</a>
              <a class="pill" href="{% url 'logout' %}">Logout</a>
            {% else %}
              <a class="pill" href="{% url 'login' %}">Login</a>
              <a class="pill" href="{% url 'signup' %}">Sign up</a>
            {% endif %}
            <a class="pill" href="{% url 'admin:index' %}">Admin</a>
          </nav>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer>
      <div class="container footer-inner">
        <img
          src="{% static 'brainblitz/logo.svg' %}"
          width="22"
          height="22"
          alt=""
          decoding="async"
        />
        <span>© {% now "Y" %} BrainBlitz</span>
      </div>
    </footer>
  </body>
</html>
