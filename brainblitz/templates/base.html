<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}BrainBlitz{% endblock %}</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: rgba(255, 255, 255, 0.06);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --border: rgba(255, 255, 255, 0.12);
        --brand: #7c5cff;
        --brand2: #23c3ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(1200px 800px at 20% 0%, rgba(124, 92, 255, 0.35), transparent 55%),
          radial-gradient(1000px 700px at 80% 10%, rgba(35, 195, 255, 0.25), transparent 55%),
          var(--bg);
        color: var(--text);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .container {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
      }
      header {
        position: sticky;
        top: 0;
        backdrop-filter: blur(10px);
        background: rgba(11, 16, 32, 0.55);
        border-bottom: 1px solid var(--border);
        z-index: 10;
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.3px;
      }
      .logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--brand), var(--brand2));
        box-shadow: 0 10px 30px rgba(124, 92, 255, 0.35);
      }
      .links {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
        color: var(--muted);
        transition: 160ms ease;
      }
      .pill:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }
      main {
        padding: 26px 0 50px;
      }
      .card {
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      h1,
      h2,
      h3 {
        margin: 0 0 10px 0;
      }
      p {
        margin: 0 0 12px 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 14px;
      }
      .col-12 {
        grid-column: span 12;
      }
      .col-8 {
        grid-column: span 8;
      }
      .col-4 {
        grid-column: span 4;
      }
      @media (max-width: 900px) {
        .col-8,
        .col-4 {
          grid-column: span 12;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: linear-gradient(135deg, rgba(124, 92, 255, 0.9), rgba(35, 195, 255, 0.8));
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .btn.secondary {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 2px 6px;
        border-radius: 8px;
      }
      footer {
        padding: 18px 0 40px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 14px;
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <header>
      <div class="container">
        <div class="nav">
          <a class="brand" href="{% url 'home' %}">
            <span class="logo" aria-hidden="true"></span>
            <span>BrainBlitz</span>
          </a>
          <nav class="links">
            <a class="pill" href="{% url 'home' %}">Home</a>
            <a class="pill" href="{% url 'quiz:list' %}">Quiz list</a>
            <a class="pill" href="{% url 'quiz:submit_question' %}">Submit question</a>
            {% if request.user.is_authenticated %}
              <a class="pill" href="{% url 'profile' %}">Profile</a>
              <a class="pill" href="{% url 'logout' %}">Logout</a>
            {% else %}
              <a class="pill" href="{% url 'login' %}">Login</a>
              <a class="pill" href="{% url 'signup' %}">Sign up</a>
            {% endif %}
            <a class="pill" href="{% url 'admin:index' %}">Admin</a>
          </nav>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer>
      <div class="container">© {% now "Y" %} BrainBlitz</div>
    </footer>
  </body>
</html>
